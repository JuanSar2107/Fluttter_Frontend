server {
    listen 8044;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Flutter no pone hash en estos nombres: si se cachean, el navegador sigue
    # mostrando la version anterior tras un despliegue.
    location ~* \.(?:js|json|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /downloads/ {
        types {
            application/vnd.android.package-archive apk;
            application/gzip gz;
            application/zip zip;
        }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|woff2?|otf|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
