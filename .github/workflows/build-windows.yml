# Compila la version de Windows en un runner de GitHub (Flutter no compila
# para Windows desde Linux) y la publica como artefacto descargable.
#
# Uso: pestana Actions -> "Build Windows" -> Run workflow. Al terminar, el zip
# esta en "Artifacts"; copialo a web/downloads/aeroparts-windows-x64.zip.
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Misma version que la usada en local (Dart 3.13, ver pubspec.yaml).
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - name: Empaquetar
        shell: pwsh
        run: ./tool/package_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: aeroparts-windows-x64
          path: web/downloads/aeroparts-windows-x64.zip
          if-no-files-found: error
